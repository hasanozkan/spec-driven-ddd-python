[project]
name = "library-sample"
version = "0.1.0"
description = "A spec-driven, domain-driven modular monolith in miniature."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library"]

[tool.hatch.build.targets.wheel.force-include]
"src/library/lending/domain/policy.yaml" = "library/lending/domain/policy.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rule(id): the spec rule this test proves (checked by scripts/check_trace.py)"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["library"]
mypy_path = "src"

# The architecture, as a build failure instead of a wiki page.
[tool.importlinter]
root_package = "library"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Bounded contexts never import each other (they talk through contracts.events)"
type = "independence"
modules = ["library.catalog", "library.lending"]

[[tool.importlinter.contracts]]
name = "Inside a module: api -> application -> domain, never upwards"
type = "layers"
containers = ["library.catalog", "library.lending"]
layers = ["api", "application", "domain"]

[[tool.importlinter.contracts]]
name = "The domain knows no framework"
type = "forbidden"
source_modules = ["library.catalog.domain", "library.lending.domain"]
forbidden_modules = ["fastapi", "pydantic", "starlette"]
