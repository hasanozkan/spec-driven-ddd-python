name: links
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # linkedin.com answers bots with HTTP 999; it is excluded, not ignored silently.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback --exclude 'localhost' --exclude 'linkedin\.com' '**/*.md'
          fail: true
