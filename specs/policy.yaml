# THE single source of lending policy. The spec owns the numbers; the code
# vendors a byte-identical copy (src/library/lending/domain/policy.yaml) and
# `make mirror` fails the build the moment the two differ. A policy change is
# therefore always a spec change first — reviewed where the rule is written.
version: 1
tiers:
  standard:
    max_active_loans: 3
    loan_days: 14
    late_fee_per_day_cents: 25
    max_late_fee_cents: 1000
  premium:
    max_active_loans: 6
    loan_days: 28
    late_fee_per_day_cents: 10
    max_late_fee_cents: 500
